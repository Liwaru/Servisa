name: servisa

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: servisa
      DB_USERNAME: servisa
      DB_PASSWORD: servisa_password
      SESSION_DRIVER: database
      CACHE_STORE: file
    command: >-
      sh -c "composer install --no-interaction --prefer-dist
      && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi
      && php artisan config:clear
      && php artisan migrate --force
      && php artisan db:seed --force
      && php-fpm"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - servisa_network

  web:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - servisa_network

  db:
    image: mysql:8.4
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: servisa
      MYSQL_USER: servisa
      MYSQL_PASSWORD: servisa_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - servisa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - servisa_network

volumes:
  servisa_mysql_data:

networks:
  servisa_network:
    driver: bridge
